<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>SP 区块渲染预览</title>
<link rel="stylesheet" href="../global.css">
<style>
  body { margin: 0; padding: 20px; background: #f0f1f5; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 16px; color: #333; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #777; margin-bottom: 16px; }
  .theme-panel { border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .theme-panel.light { background: #ffffff; }
  .theme-panel.dark { background: #1c1c22; color: #e8e8ef; }
  .panel-title { font-size: 12px; font-weight: 600; opacity: .6; margin-bottom: 10px; letter-spacing: .04em; }
  .sp-content { max-height: none; overflow: visible; }
  .sp-editor-body { max-height: none; overflow: visible; }
  .card-demo { background: var(--bg-primary); border-radius: 12px; padding: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>SP 区块渲染预览</h1>
  <div class="sub">使用真实代码渲染：global.css + sp_format.js + 19_system_prompt显示与编辑.js（展示区 + 编辑区配色）</div>

  <div class="theme-panel light" data-theme="light">
    <div class="panel-title">浅色主题 · 展示区（#spDisplay）</div>
    <div class="sp-content" id="displayLight"></div>
  </div>

  <div class="theme-panel dark" data-theme="dark">
    <div class="panel-title">深色主题 · 展示区（#spDisplay）</div>
    <div class="sp-content" id="displayDark"></div>
  </div>

  <div class="theme-panel light" data-theme="light">
    <div class="panel-title">浅色主题 · 编辑区区块卡片</div>
    <div class="card-demo" id="editorLight"></div>
  </div>
</div>

<script src="../js/sp_format.js"></script>
<script src="../js/26_工具函数.js"></script>
<script src="../js/19_system_prompt显示与编辑.js"></script>
<script>
var SAMPLE = '<roleplay_sp format="1">\n' +
  '  <task>你现在是一个多角色扮演模拟引擎，负责驱动一个叙事世界。你的任务是：\n- 严格遵循指定角色的身份、性格、知识背景和说话风格。\n- 用户：根据关系和性格有对应亲密称呼，默认为你。\n- 推动符合当前世界观下的合理剧情发展。</task>\n' +
  '  <characters>\n' +
  '    <character name="林梦">\n' +
  '      <identity>XX大学文学系大二学生，学生会文艺部部长</identity>\n' +
  '      <appearance>身高165cm，一头柔顺的黑色长发垂至腰际，轻薄空气刘海，浅琥珀色眼睛清澈透亮，常穿白色雪纺连衣裙配米色开衫</appearance>\n' +
  '      <personality>温柔细腻但内心坚韧，偶尔会流露出俏皮的一面</personality>\n' +
  '      <history>从小学习古筝，参加过多场市级演出</history>\n' +
  '    </character>\n' +
  '    <character name="苏晴">\n' +
  '      <identity>26岁的产品设计师，林梦的学姐</identity>\n' +
  '      <appearance>身高172cm，黑色短发利落干练，金色耳坠，深蓝色修身西装</appearance>\n' +
  '      <personality>锐利而温柔，嘴硬心软</personality>\n' +
  '    </character>\n' +
  '  </characters>\n' +
  '  <backstory>深夜的图书馆闭馆前，林梦发现苏晴撕掉了自己借书卡上的预约记录，两人在书架间对峙。</backstory>\n' +
  '  <state>两人在天台夜谈，气氛刚刚缓和</state>\n' +
  '  <samples>\n' +
  '    <sample char="林梦">「诶？你、你别突然凑这么近啦……书都要被你挡住了。」</sample>\n' +
  '    <sample char="苏晴">「迟到一分钟就要罚你陪我喝一杯咖啡，这可是规矩。」</sample>\n' +
  '  </samples>\n' +
  '  <rules>\n' +
  '    <rule id="speaker-format">回复时以角色名字用【】开头分段。如果是旁白则直接加在文本开始或结尾。除角色名外，消息内不再出现【】字符。</rule>\n' +
  '  </rules>\n' +
  '  <world name="校园">故事发生在临江大学城</world>\n' +
  '</roleplay_sp>';

document.getElementById('displayLight').innerHTML = renderSpBlocksHtml(SAMPLE);
document.getElementById('displayDark').innerHTML = renderSpBlocksHtml(SAMPLE);

var model = parseSp(SAMPLE);
document.getElementById('editorLight').innerHTML = spEditorCardsHtml(model);
window.__previewModel = model;
</script>
</body>
</html>
