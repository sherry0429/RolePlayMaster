<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>

<!-- PWA Meta -->
<meta name="application-name" content="AI Chat">
<meta name="description" content="AI 聊天助手，支持自定义 System Prompt">
<meta name="theme-color" content="#4a90d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI Chat">
<meta name="msapplication-TileColor" content="#4a90d9">
<meta name="msapplication-TileImage" content="icons/icon-144.png">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-72.png">
<link rel="stylesheet" href="global.css">
</head>
<body>

<!-- Toast 通知容器 -->
<div class="toast-container" id="toastContainer"></div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- 主容器 -->
<div class="app-container">

  <!-- 移动端侧边栏遮罩（放在 app-container 内以确保 z-index stacking context 正确） -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ========== 左侧边栏 ========== -->
  <aside class="sidebar" id="sidebar">
    <!-- 设置区 -->
    <div class="settings-section">
      <div class="settings-toggle" id="settingsToggle" onclick="toggleSettings()">
        <span>⚙️ 设置</span>
        <span class="icon">▼</span>
      </div>
      <div class="settings-form" id="settingsForm">
        <div class="form-group">
          <label>API HOST</label>
          <input type="text" id="apiHost" placeholder="https://api.deepseek.com">
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="apiKey" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label>全局背景图片</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="btn-sm btn-primary" onclick="document.getElementById('bgImageFile').click()">📷 上传</button>
            <button class="btn-sm btn-danger" onclick="clearBgImage()" id="clearBgBtn" style="display:none;">🗑️ 清除</button>
            <span id="bgImageStatus" style="font-size:12px;color:var(--text-secondary);"></span>
          </div>
          <input type="file" id="bgImageFile" accept="image/*" style="display:none" onchange="handleBgImageUpload(event, false)">
        </div>
        <div class="form-group">
          <label>摘要压缩阈值（每多少条消息触发一次 System Prompt 更新）</label>
          <input type="number" id="compressThreshold" placeholder="300" min="10" max="9999">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="speakerMode" checked>
          <label for="speakerMode">说话人区分（用【】拆分多角色消息）</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="autoTopic">
          <label for="autoTopic">自动找话题</label>
        </div>
        <div class="form-group" id="autoTopicConfig" style="display:none;">
          <label>触发间隔（分钟，支持小数，最小0.1=6秒，默认10）</label>
          <input type="number" id="autoTopicInterval" placeholder="10" min="0.1" step="0.1" max="120">
          <label style="margin-top:4px;">触发次数上限（默认5，用户输入后重置）</label>
          <input type="number" id="autoTopicMaxCount" placeholder="5" min="1" max="100">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="chatNotification" disabled checked="false">
          <label for="chatNotification">聊天通知</label>
        </div>
        <div class="sync-token-group">
          <label>同步 Token</label>
          <input type="text" id="syncToken" placeholder="填写同步用的 Token">
        </div>
        <div class="sync-token-group">
          <label>云端同步地址（含云端导入导出和通知功能）</label>
          <input type="text" id="cloudSyncHost" placeholder="https://poecurrency.top">
        </div>
        <!-- ComfyUI 设置 -->
        <div class="settings-section-title" style="margin-top:16px;font-size:13px;font-weight:600;color:var(--text-primary);">🎨 ComfyUI 图像生成</div>
        <div class="checkbox-group">
          <input type="checkbox" id="comfyuiEnabled">
          <label for="comfyuiEnabled">启用 ComfyUI（关闭则使用默认 AI 生成图片）</label>
        </div>
        <div class="form-group">
          <label>ComfyUI 服务器地址</label>
          <input type="text" id="comfyuiServerUrl" placeholder="http://127.0.0.1:8188">
        </div>
        <div class="form-group">
          <label>上传工作流 JSON</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="btn-sm btn-primary" onclick="document.getElementById('comfyuiWorkflowFile').click()">📂 上传</button>
            <span id="comfyuiWorkflowStatus" style="font-size:12px;color:var(--text-secondary);">未上传</span>
          </div>
          <input type="file" id="comfyuiWorkflowFile" accept=".json" style="display:none" onchange="handleComfyuiWorkflowUpload(event)">
        </div>
        <div class="form-group">
          <label>提示词节点 ID（工作流中接收正向提示词的节点）</label>
          <input type="text" id="comfyuiPromptNodeId" placeholder="例如: 6">
        </div>
        <div class="form-group">
          <label>宽度节点 ID（控制生成图像宽度的节点）</label>
          <input type="text" id="comfyuiWidthNodeId" placeholder="例如: 5">
        </div>
        <div class="form-group">
          <label>高度节点 ID（控制生成图像高度的节点）</label>
          <input type="text" id="comfyuiHeightNodeId" placeholder="例如: 5">
        </div>
        <div style="display:flex;gap:8px;">
          <div class="form-group" style="flex:1;">
            <label>默认宽度</label>
            <input type="number" id="comfyuiDefaultWidth" placeholder="512" min="64" max="2048">
          </div>
          <div class="form-group" style="flex:1;">
            <label>默认高度</label>
            <input type="number" id="comfyuiDefaultHeight" placeholder="768" min="64" max="2048">
          </div>
        </div>
        <!-- /ComfyUI 设置 -->
        <div class="btn-row">
          <button class="btn-sm btn-primary" onclick="saveSettings()">保存</button>
          <button class="btn-sm btn-ghost" onclick="resetSettings()">重置默认</button>
        </div>
      </div>
    </div>

    <!-- 数据操作区 -->
    <div class="data-section">
      <button class="btn-sm btn-ghost" onclick="syncToCloud()">同步到云端</button>
      <button class="btn-sm btn-ghost" onclick="syncFromCloud()" id="cloudSyncBtn">从云端拉取</button>
      <button class="btn-sm btn-ghost" onclick="exportDataAsFile()">导出</button>
      <button class="btn-sm btn-ghost" onclick="importData()">导入</button>
      <button class="btn-sm btn-ghost" onclick="shareLink()">🔗 分享</button>
      <input type="file" id="importFile" accept=".txt,.json" style="display:none" onchange="handleImport(event)">
    </div>

    <!-- 聊天列表 -->
    <div class="chat-list-section" id="chatList">
      <!-- 动态渲染 -->
    </div>

    <!-- System Prompt 编辑区 -->
    <div class="sp-section" id="spSection">
      <div class="sp-header">
        <span class="sp-title">System Prompt</span>
        <button class="btn-sm btn-ghost sp-edit-btn" onclick="spStartEdit()" id="spEditBtn">✏️ 编辑</button>
        <span class="sp-version-badge" id="spVersionBadge">v0</span>
      </div>
      <div class="sp-version-nav">
        <button onclick="spNavPrev()" id="spPrevBtn" title="上一版本">◀</button>
        <span class="sp-version-text" id="spVersionText">无版本</span>
        <button onclick="spNavNext()" id="spNextBtn" title="下一版本">▶</button>
      </div>
      <div class="sp-content" id="spDisplay">暂无 System Prompt</div>
    </div>
  </aside>

  <!-- ========== 右侧主区域 ========== -->
  <div class="main-area">
    <!-- 背景图片层 - 覆盖主区域 -->
    <div id="bg-layer"></div>
    <!-- 顶部栏 -->
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()" title="菜单">☰</button>
      <span class="current-chat-name" id="currentChatName">AI Chat</span>
      <button class="toolbar-btn replay-btn" id="replayBtn" onclick="toggleReplay()" title="重放">🔄 重放</button>
      <span class="auto-topic-countdown" id="autoTopicCountdown" style="display:none;"></span>
      <button class="toolbar-btn" id="galleryBtn" onclick="openGalleryDrawer()" title="角色图库">🎭 角色管理</button>
      <button class="toolbar-btn" id="albumBtn" onclick="openAlbumDrawer()" title="相册" style="display:none;">🖼️ 相册</button>
      <button class="toolbar-btn theme-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题">🌙 主题</button>
      <button class="toolbar-btn" onclick="openLogDrawer()" title="程序日志">📋 日志</button>
      <div class="replay-progress" id="replayProgress" style="width:0;"></div>
    </div>

    <!-- 聊天消息区域 -->
    <div class="chat-area" id="chatArea">
      <div class="welcome-msg" id="welcomeMsg">
        👋 欢迎使用 AI Chat<br>点击左侧 + 开始新对话
      </div>
    </div>

    <!-- 快捷指令 -->
    <div class="quick-actions" id="quickActions">
      <button class="quick-action-btn" onclick="triggerMemory()">🧠 /记忆</button>
      <button class="quick-action-btn" onclick="triggerContinue()">▶ /继续</button>
      <button class="quick-action-btn" id="photoActionBtn" onclick="triggerTakePhoto()" style="display:none;">📷 拍照</button>
    </div>

    <!-- 拍摄进度条 -->
    <div class="photo-progress" id="photoProgressBar" style="display:none;">
      <span class="photo-progress-text" id="photoProgressText">📸 拍摄中...</span>
      <div class="photo-progress-track">
        <div class="photo-progress-fill" id="photoProgressFill"></div>
      </div>
      <button class="photo-progress-cancel" id="photoProgressCancel" onclick="cancelPhoto()" title="取消拍摄">✕</button>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
      <textarea id="userInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      <button class="send-btn stop-btn" id="stopBtn" onclick="stopStreaming()" style="display:none;">⏹</button>
    </div>
  </div>
</div>

<!-- 右侧 Log 抽屉 -->
<div class="drawer-backdrop" id="logBackdrop"></div>
<div class="log-drawer" id="logDrawer">
  <div class="log-drawer-header">
    <h3>📋 程序日志</h3>
    <button class="log-drawer-close" onclick="closeLogDrawer()">✕</button>
  </div>
  <div class="log-drawer-body" id="logDrawerBody">
    <div class="log-empty">暂无程序日志</div>
  </div>
</div>

<!-- 相册抽屉 -->
<div class="drawer-backdrop" id="albumBackdrop"></div>
<div class="album-drawer" id="albumDrawer">
  <div class="album-drawer-header">
    <h3>🖼️ 相册</h3>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="albumChatName" style="font-size:13px;color:var(--text-secondary);"></span>
      <button class="album-clear-btn" id="albumClearBtn" onclick="clearAllAlbumPhotos()" title="清空当前聊天的所有照片">🗑️ 清空</button>
      <button class="log-drawer-close" onclick="closeAlbumDrawer()">✕</button>
    </div>
  </div>
  <div class="album-drawer-body" id="albumDrawerBody">
    <div class="album-empty">暂无照片，点击「📷 拍照」拍摄第一张</div>
  </div>
</div>

<!-- 压缩记忆遮罩 -->
<div class="compress-overlay" id="compressOverlay">
  <div class="compress-spinner"></div>
  <div class="compress-text">🧠 正在整理记忆...</div>
</div>

<!-- 角色图库抽屉 -->
<div class="drawer-backdrop" id="galleryBackdrop"></div>
<div class="gallery-drawer" id="galleryDrawer">
  <div class="gallery-drawer-header">
    <h3>🎭 角色图库</h3>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="mode-switch-btn" id="charSelectModeBtn" onclick="toggleCharSelectMode()">👥 群聊</button>
      <button class="gallery-add-btn" onclick="exportCharacters()">导出</button>
      <button class="gallery-add-btn" onclick="importCharacters()">导入</button>
      <button class="gallery-add-btn" onclick="addCharacter()">➕ 新增</button>
      <button class="log-drawer-close" onclick="closeGalleryDrawer()">✕</button>
      <input type="file" id="charImportFile" accept=".json" style="display:none" onchange="handleCharImport(event)">
    </div>
  </div>
  <div class="gallery-drawer-body" id="galleryDrawerBody">
    <div class="gallery-empty">暂无角色，点击「新增」添加</div>
  </div>
  <div class="char-select-bar" id="charSelectBar">
    <span class="select-info" id="charSelectInfo">未选择角色</span>
    <div class="btn-confirm-group">
      <button class="btn-sm btn-ghost" onclick="cancelCharSelect()">取消</button>
      <button class="btn-sm btn-primary" id="charSelectConfirmBtn" onclick="confirmCharSelect()" disabled>确认建群</button>
    </div>
  </div>
</div>

<!-- 拍照角色选择对话框 -->
<div class="modal-overlay" id="photoCharSelectOverlay" style="display:none;">
  <div class="modal" id="photoCharSelectModal" style="max-width:400px;">
    <h3>📷 选择拍照角色</h3>
    <div style="color:var(--text-secondary);font-size:13px;margin-bottom:12px;">可选择一至多个角色进行拍照</div>
    <div id="photoCharSelectList" style="max-height:300px;overflow-y:auto;margin-bottom:16px;">
      <!-- 动态渲染角色复选框 -->
    </div>
    <div class="modal-btns">
      <button class="btn-sm btn-primary" id="photoCharSelectConfirm" onclick="confirmPhotoCharSelect()">确认拍照</button>
      <button class="btn-sm btn-ghost" onclick="closePhotoCharSelect()">取消</button>
    </div>
  </div>
</div>

<script src="./js/01_常量.js"></script>
<script src="./js/00_prompts.js"></script>
<script src="./js/02_全局状态.js"></script>
<script src="./js/03_数据结构.js"></script>
<script src="./js/04_存储.js"></script>
<script src="./js/05_初始化.js"></script>
<script src="./js/06_pwa.js"></script>
<script src="./js/07_主题.js"></script>
<script src="./js/08_背景图片.js"></script>
<script src="./js/09_背景图片上传.js"></script>
<script src="./js/10_设置区.js"></script>
<script src="./js/11_聊天管理.js"></script>
<script src="./js/12_消息渲染.js"></script>
<script src="./js/13_重放功能.js"></script>
<script src="./js/14_消息编辑与删除.js"></script>
<script src="./js/15_发送消息.js"></script>
<script src="./js/16_快捷指令.js"></script>
<script src="./js/17_流式AI请求.js"></script>
<script src="./js/18_system_prompt记忆功能.js"></script>
<script src="./js/19_system_prompt显示与编辑.js"></script>
<script src="./js/20_数据导入导出.js"></script>
<script src="./js/21_分享链接.js"></script>
<script src="./js/22_侧边栏.js"></script>
<script src="./js/23_log抽屉.js"></script>
<script src="./js/24_模态框.js"></script>
<script src="./js/25_toast通知.js"></script>
<script src="./js/26_工具函数.js"></script>
<script src="./js/27_角色图库.js"></script>
<script src="./js/28_角色导入导出.js"></script>
<script src="./js/29_群聊功能.js"></script>
<script src="./js/30_自动找话题.js"></script>
<script src="./js/31_消息分页渲染.js"></script>
<script src="./js/32_启动.js"></script>
<script src="./js/33_拍照功能.js"></script>
<script src="./js/34_相册功能.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
