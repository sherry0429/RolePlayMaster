// ==================== 数据导入导出 ====================
// 工具函数：JSON ↔ Base64 互转（支持中文）
function jsonToBase64(jsonStr) {
  // 先用 encodeURIComponent 处理中文，再 btoa
  return btoa(unescape(encodeURIComponent(jsonStr)));
}

function base64ToJson(b64Str) {
  // atob 解码后再用 decodeURIComponent 恢复中文
  return decodeURIComponent(escape(atob(b64Str.trim())));
}

// ---- 压缩/解压工具（gzip + base64url） ----
function arrayBufferToBase64Url(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64UrlToArrayBuffer(b64url) {
  let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

async function compressText(text) {
  if (typeof CompressionStream !== 'undefined') {
    try {
      const blob = new Blob([text]);
      const cs = new CompressionStream('gzip');
      const stream = blob.stream().pipeThrough(cs);
      const compressed = await new Response(stream).arrayBuffer();
      return 'v2:' + arrayBufferToBase64Url(compressed);
    } catch (e) {
      console.warn('CompressionStream 失败，回退到 base64', e);
    }
  }
  return 'v1:' + jsonToBase64(text);
}

async function decompressText(encoded) {
  if (encoded.startsWith('v2:')) {
    const b64 = encoded.slice(3);
    const compressed = base64UrlToArrayBuffer(b64);
    if (typeof DecompressionStream !== 'undefined') {
      const blob = new Blob([compressed]);
      const ds = new DecompressionStream('gzip');
      const stream = blob.stream().pipeThrough(ds);
      return await new Response(stream).text();
    }
    throw new Error('浏览器不支持解压缩');
  }
  if (encoded.startsWith('v1:')) {
    return base64ToJson(encoded.slice(3));
  }
  // 旧格式（无前缀）：直接 base64
  return base64ToJson(encoded);
}

function exportDataAsFile() {
  try {
    const json = JSON.stringify(appData);
    const base64 = jsonToBase64(json);
    const blob = new Blob([base64], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aichat_backup_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('数据已导出（Base64 编码）', 'success');
  } catch (e) {
    console.error('导出失败', e);
    showToast('导出失败: ' + e.message, 'error');
  }
}

function importData() {
  document.getElementById('importFile').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const rawText = e.target.result.trim();
      let data;

      // 尝试 base64 解码
      try {
        const jsonStr = base64ToJson(rawText);
        data = JSON.parse(jsonStr);
      } catch (b64Err) {
        // base64 失败，尝试直接解析为 JSON（兼容旧格式）
        try {
          data = JSON.parse(rawText);
        } catch (jsonErr) {
          throw new Error('文件格式无效，无法解析');
        }
      }

      if (!data.chats || !data.settings) {
        throw new Error('无效的数据格式');
      }

      // 兼容性补全
      if (!data.chatOrder) data.chatOrder = Object.keys(data.chats);
      if (!data.chatCounter) data.chatCounter = data.chatOrder.length;
      if (!data.theme) data.theme = 'light';
      if (!data.characters) data.characters = [];
      if (!data.settings.speakerMode) data.settings.speakerMode = true;
      if (!data.settings.syncToken) data.settings.syncToken = '';
      if (!data.settings.autoTopic) data.settings.autoTopic = false;
      if (!data.settings.chatNotification) data.settings.chatNotification = false;
      if (data.settings.autoTopicInterval === undefined) data.settings.autoTopicInterval = 10;
      if (data.settings.autoTopicMaxCount === undefined) data.settings.autoTopicMaxCount = 5;
      // 如果是分享精简数据（_shareLite 标记），需要转换为完整结构
      if (data._shareLite) {
        data = expandShareData(data);
      }

      appData = data;
      saveData();
      applyImportedData(data);
      showToast('数据导入成功', 'success');
    } catch (err) {
      showToast('导入失败: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  // 重置 input 以允许重复导入同一文件
  event.target.value = '';
}

// ==================== 分享链接（精简版：不含聊天记录） ====================

/**
 * 构建精简的分享数据：
 * - 总配置（theme, settings）
 * - 每个聊天框的：名称、背景图、最新 system_prompt
 * - 不含聊天记录（messages）、不含历史 sp 版本
 */
function buildShareLiteData() {
  const lite = {
    _shareLite: true,
    theme: appData.theme,
    settings: { ...appData.settings },
    // 不含 apiKey 的敏感信息
    chats: {},
    chatOrder: [...appData.chatOrder],
    chatCounter: appData.chatCounter,
    characters: JSON.parse(JSON.stringify(appData.characters || []))
  };
  // 复制 settings 但清除 apiKey 等敏感信息
  delete lite.settings.apiKey;
  delete lite.settings.syncToken;

  for (const id of appData.chatOrder) {
    const chat = appData.chats[id];
    if (!chat) continue;
    // 只保留最新 system prompt 版本
    const latestSp = chat.spVersions[chat.spVersions.length - 1] || { version: 0, content: '', lastIndex: -1 };
    lite.chats[id] = {
      name: chat.name,
      bgImage: chat.bgImage,
      messages: [],  // 不分享聊天记录
      spVersions: [{ version: latestSp.version, content: latestSp.content, lastIndex: -1 }],
      spViewIndex: 0
    };
  }
  return lite;
}

/**
 * 将精简分享数据展开为完整结构（用于导入时）
 */
function expandShareData(liteData) {
  const full = createDefaultData();
  full.theme = liteData.theme || 'light';
  full.settings = { ...full.settings, ...liteData.settings };
  full.chatOrder = liteData.chatOrder || [];
  full.chatCounter = liteData.chatCounter || 0;
  full.characters = liteData.characters || [];

  for (const id of full.chatOrder) {
    const chat = liteData.chats[id];
    if (!chat) continue;
    full.chats[id] = {
      name: chat.name,
      bgImage: chat.bgImage || '',
      messages: [],
      spVersions: chat.spVersions || [{ version: 0, content: '', lastIndex: -1 }],
      spViewIndex: 0
    };
  }
  return full;
}

async function shareLink() {
  try {
    const liteData = buildShareLiteData();
    const json = JSON.stringify(liteData);
    const encoded = await compressText(json);
    const url = window.location.origin + window.location.pathname + '#share=' + encoded;

    // 尝试使用剪贴板 API
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('分享链接已复制（仅配置，不含聊天记录）', 'success');
      }).catch(() => {
        fallbackCopy(url);
      });
    } else {
      fallbackCopy(url);
    }
  } catch (e) {
    showToast('生成分享链接失败', 'error');
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('分享链接已复制（仅配置，不含聊天记录）', 'success');
  } catch (e) {
    showModal('分享链接', text, null, true);
  }
  document.body.removeChild(ta);
}

async function checkShareData() {
  const hash = window.location.hash;
  if (hash.startsWith('#share=')) {
    const encoded = hash.slice(7);
    try {
      const jsonStr = await decompressText(encoded);
      const data = JSON.parse(jsonStr);

      // 判断是精简版还是完整版
      const isLite = data._shareLite === true;
      const desc = isLite ? '配置和 System Prompt（不含聊天记录）' : '完整数据';

      if (!data.chats || !data.settings) {
        throw new Error('无效的分享数据');
      }

      if (confirm(`检测到分享数据（${desc}），是否导入？这将覆盖当前数据。`)) {
        if (isLite) {
          appData = expandShareData(data);
        } else {
          appData = data;
          if (!appData.chatOrder) appData.chatOrder = Object.keys(appData.chats);
          if (!appData.chatCounter) appData.chatCounter = appData.chatOrder.length;
          if (!appData.theme) appData.theme = 'light';
          if (!appData.characters) appData.characters = [];
        }
        saveData();
        applyImportedData(data);
        showToast('分享数据导入成功', 'success');
      }
      // 清除 hash
      history.replaceState(null, '', window.location.pathname);
    } catch (e) {
      console.error('分享数据解析失败', e);
      showToast('分享数据解析失败: ' + e.message, 'error');
    }
  }
}

/* 渲染日志内容：最近 3 条请求的 messages 以树形展示 */
function renderLogContent() {

  if (requestLog.length === 0) {

/* JSON 树形渲染，用于展示 messages 数组 */
function renderJsonTree({ key, value, isArray, isLast, depth }) {
  depth = depth || 0;
  let html = '';
  const indent = 'padding-left:' + (depth * 20) + 'px;';

  if (value === null) {
    html += `<div style="${indent}"><span class="json-key">${escHtml(key)}</span>: <span class="json-null">null</span>${isLast ? '' : ','}</div>`;
    return html;
  }

  if (typeof value !== 'object') {
    // 基本类型
    let valClass = 'json-string';
    let valDisplay = escHtml(JSON.stringify(value));
    if (typeof value === 'number') { valClass = 'json-number'; }
    else if (typeof value === 'boolean') { valClass = 'json-bool'; }
    html += `<div style="${indent}"><span class="json-key">${escHtml(key)}</span>: <span class="${valClass}">${valDisplay}</span>${isLast ? '' : ','}</div>`;
    return html;
  }

  // 数组或对象
  const entries = isArray
    ? value.map((v, i) => ({ k: String(i), v: v, isObj: typeof v === 'object' && v !== null }))
    : Object.entries(value).map(([k, v]) => ({ k: k, v: v, isObj: typeof v === 'object' && v !== null }));

  const count = entries.length;
  const openBracket = isArray ? '[' : '{';
  const closeBracket = isArray ? ']' : '}';
  const nodeId = 'jtn_' + Math.random().toString(36).slice(2, 10);

  // 特殊处理：messages 数组的每个元素展示为带 role 标签的卡片
  if (key === 'messages' && isArray) {
    html += `<div style="${indent}"><span class="json-key">messages</span> <span class="json-bracket">[</span> <span class="json-count">${count} items</span></div>`;
    html += `<div class="json-children show" style="padding-left:12px;">`;
    entries.forEach((entry, idx) => {
      const msg = entry.v;
      const role = msg.role || 'unknown';
      const roleClass = 'role-' + role;
      const content = msg.content || '';
      const preview = content.length > 500 ? content.slice(0, 500) + '\n... (truncated)' : content;
      html += `<div style="margin-bottom:10px;border:1px solid var(--border-color);border-radius:8px;overflow:hidden;">`;
      html += `<div style="display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg-secondary);">`;
      html += `<span class="msg-role-tag ${roleClass}">${escHtml(role)}</span>`;
      html += `<span style="font-size:12px;color:var(--text-tertiary);">[${idx}]</span>`;
      html += `</div>`;
      html += `<div class="msg-content-preview">${escHtml(preview)}</div>`;
      html += `</div>`;
    });
    html += `</div>`;
    html += `<div style="${indent}"><span class="json-bracket">]</span></div>`;
    return html;
  }

  // 通用对象/数组：可展开折叠
  html += `<div style="${indent}">`;
  html += `<span class="json-toggle" onclick="toggleJsonNode('${nodeId}', this)">`;
  html += `<span class="json-arrow">▶</span>`;
  if (!isArray) html += `<span class="json-key">${escHtml(key)}</span>: `;
  else if (key) html += `<span class="json-key">${escHtml(key)}</span> `;
  html += `<span class="json-bracket">${openBracket}</span>`;
  html += `<span class="json-count">${count}</span>`;
  html += `</span>`;
  html += `</div>`;

  html += `<div class="json-children" id="${nodeId}" style="padding-left:20px;">`;
  entries.forEach((entry, idx) => {
    const childIsArray = Array.isArray(entry.v);
    html += renderJsonTree({
      key: entry.k,
      value: entry.v,
      isArray: childIsArray,
      isLast: idx === count - 1,
      depth: depth + 1
    });
  });
  html += `</div>`;

  html += `<div style="${indent}"><span class="json-bracket">${closeBracket}</span>${isLast ? '' : ','}</div>`;
  return html;
}

function toggleJsonNode(nodeId, toggleEl) {
  const children = document.getElementById(nodeId);
  if (!children) return;
  children.classList.toggle('show');
  toggleEl.classList.toggle('open');
}

// ==================== 模态框 ====================
function showModal(title, value, onConfirm, readOnly) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');

  let html = `<h3>${escHtml(title)}</h3>`;
  if (readOnly) {
    html += `<textarea style="width:100%;min-height:80px;padding:8px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);font-size:12px;resize:vertical;font-family:monospace;" readonly>${escHtml(value)}</textarea>`;
  } else {
    html += `<input type="text" id="modalInput" value="${escHtml(value)}">`;
  }
  html += `<div class="modal-btns">`;
  if (!readOnly && onConfirm) {
    html += `<button class="btn-sm btn-primary" onclick="confirmModal()">确定</button>`;
  }
  html += `<button class="btn-sm btn-ghost" onclick="closeModal()">关闭</button>`;
  html += `</div>`;

  content.innerHTML = html;
  overlay.classList.add('show');

  // 保存回调
  if (onConfirm) {
    overlay._onConfirm = onConfirm;
  } else {
    overlay._onConfirm = null;
  }
}

/* 带大文本域的弹框，用于编辑长文本如 System Prompt */
function showTextareaModal(title, value, onConfirm) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');

  let html = `<h3>${escHtml(title)}</h3>`;
  html += `<textarea id="modalTextarea" style="width:100%;min-height:260px;max-height:60vh;padding:10px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);font-size:14px;line-height:1.5;resize:vertical;font-family:inherit;outline:none;">${escHtml(value)}</textarea>`;

  html += `<button class="btn-sm btn-primary" onclick="confirmTextareaModal()">保存</button>`;
  html += `<button class="btn-sm btn-ghost" onclick="closeModal()">取消</button>`;
  html += `</div>`;

  content.innerHTML = html;
  content.style.maxWidth = '560px';
  overlay.classList.add('show');

  // 聚焦文本域
  setTimeout(() => {
    const ta = document.getElementById('modalTextarea');
    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }, 50);

  // 保存回调
  overlay._onConfirm = onConfirm;
  overlay._isTextarea = true;
}

function confirmTextareaModal() {
  const ta = document.getElementById('modalTextarea');
  const overlay = document.getElementById('modalOverlay');
  if (ta && overlay._onConfirm) {
    overlay._onConfirm(ta.value);

  closeModal();

function confirmModal() {
  const input = document.getElementById('modalInput');
  if (input && document.getElementById('modalOverlay')._onConfirm) {
    document.getElementById('modalOverlay')._onConfirm(input.value);
  }
  closeModal();
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  overlay.classList.remove('show');
  overlay._onConfirm = null;
  overlay._isTextarea = null;
  content.style.maxWidth = ''; // 重置弹框宽度
}

// 点击遮罩关闭
document.getElementById('modalOverlay').addEventListener('click', (e) => {

// ==================== 工具函数 ====================
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

/**
 * 简易 Markdown 渲染
 * 支持：代码块、行内代码、粗体、斜体、列表
 */
function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);

  // 代码块 ```
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${code.trim()}</code></pre>`;
  });

  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // 粗体
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // 斜体
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // 换行
  html = html.replace(/\n/g, '<br>');

  return html;
}

let galleryHasMore = true;

document.getElementById('galleryBackdrop').addEventListener('click', closeGalleryDrawer);

function renderGalleryContent(append) {
  const body = document.getElementById('galleryDrawerBody');
  const chars = appData.characters || [];
  const start = append ? galleryCurrentPage * GALLERY_PAGE_SIZE : 0;
  const end = (galleryCurrentPage + 1) * GALLERY_PAGE_SIZE;
  const pageChars = chars.slice(start, end);
  galleryHasMore = end < chars.length;

  if (!append) {
    if (chars.length === 0) {
      body.innerHTML = '<div class="gallery-empty">暂无角色，点击「新增」添加</div>';
      return;
    }
    body.innerHTML = '<div class="gallery-waterfall" id="galleryWaterfall"></div>';
  }

  // 移除旧的 loading
  const oldLoading = document.getElementById('galleryLoading');
  if (oldLoading) oldLoading.remove();

  const waterfall = document.getElementById('galleryWaterfall');
  if (!waterfall) return;

  const isSelectMode = charSelectMode;

  pageChars.forEach((char, idx) => {
    const globalIdx = start + idx;
    const avatarHtml = char.avatar
      ? `<img src="${escHtml(char.avatar)}" alt="${escHtml(char.name)}">`
      : `<span class="avatar-placeholder">${escHtml(char.name.charAt(0) || '?')}</span>`;
    const isSelected = charSelectedIndices.has(globalIdx);
    const selectClass = isSelectMode ? ` selectable${isSelected ? ' selected' : ''}` : '';
    const clickAction = isSelectMode ? `toggleCharSelect(${globalIdx})` : `editCharacter(${globalIdx})`;
    const deleteBtn = isSelectMode ? '' : `<button class="gallery-card-delete" onclick="event.stopPropagation();deleteCharacter(${globalIdx})" title="删除">✕</button>`;
    waterfall.insertAdjacentHTML('beforeend', `
      <div class="gallery-card${selectClass}" onclick="${clickAction}">
        <div class="gallery-card-avatar-wrap">
          ${avatarHtml}
          ${deleteBtn}
        </div>
        <div class="gallery-card-info">
          <div class="gallery-card-name">${escHtml(char.name)}</div>
          <div class="gallery-card-desc">${escHtml(char.description || '')}</div>
        </div>
      </div>`);
  });

  if (galleryHasMore) {
    waterfall.insertAdjacentHTML('afterend', '<div class="gallery-loading" id="galleryLoading">↓ 下拉加载更多</div>');
  }

  // 监听滚动加载更多
  setupGalleryScroll();
}

function setupGalleryScroll() {
  const body = document.getElementById('galleryDrawerBody');
  body.onscroll = () => {
    if (!galleryHasMore) return;
    const loading = document.getElementById('galleryLoading');
    if (!loading) return;
    const rect = loading.getBoundingClientRect();
    if (rect.top < body.getBoundingClientRect().bottom + 100) {
      galleryCurrentPage++;
      renderGalleryContent(true);
    }
  };
}

  try {

      exportTime: new Date().toISOString(),

    };

function handleCharImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const rawText = e.target.result.trim();
      let data;
      try {
        data = JSON.parse(rawText);
      } catch (jsonErr) {
        throw new Error('JSON 格式无效');
      }

      // 验证格式
      if (!data.characters || !Array.isArray(data.characters)) {
        throw new Error('无效的角色数据格式，需要包含 characters 数组');
      }

      // 验证每个角色至少有 name
      const validChars = data.characters.filter(c => c && c.name);
      if (validChars.length === 0) {
        throw new Error('未找到有效角色数据');
      }

      // 检查重复：同名角色询问是否覆盖
      if (!appData.characters) appData.characters = [];
      let added = 0, updated = 0;
      for (const char of validChars) {
        const existIdx = appData.characters.findIndex(c => c.name === char.name);
        if (existIdx >= 0) {
          // 同名覆盖
          appData.characters[existIdx] = {
            ...appData.characters[existIdx],
            name: char.name,
            avatar: char.avatar || appData.characters[existIdx].avatar || '',
            description: char.description !== undefined ? char.description : appData.characters[existIdx].description
          };
          updated++;
        } else {
          // 新增
          appData.characters.push({
            id: char.id || Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            name: char.name,
            avatar: char.avatar || '',
            description: char.description || ''
          });
          added++;
        }
      }

      saveData();
      galleryCurrentPage = 0;
      renderGalleryContent();
      if (currentChatId) renderMessages();
      showToast(`角色导入完成：新增 ${added} 个，更新 ${updated} 个`, 'success');
    } catch (err) {
      showToast('角色导入失败: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function toggleCharSelect(idx) {
  if (!charSelectMode) return;
  if (charSelectedIndices.has(idx)) {
    charSelectedIndices.delete(idx);
  } else {
    charSelectedIndices.add(idx);
  }
  // 更新对应卡片的 class（无需全量重渲染）
  const waterfall = document.getElementById('galleryWaterfall');
  if (!waterfall) return;
  const cards = waterfall.querySelectorAll('.gallery-card');
  cards.forEach(card => {
    const onclick = card.getAttribute('onclick') || '';
    const match = onclick.match(/toggleCharSelect\((\d+)\)/);
    if (match) {
      const cardIdx = parseInt(match[1]);
      if (charSelectedIndices.has(cardIdx)) {
        card.classList.add('selected');
      } else {
        card.classList.remove('selected');
      }
    }
  });
  updateCharSelectInfo();
}

function updateCharSelectInfo() {
  const info = document.getElementById('charSelectInfo');
  const btn = document.getElementById('charSelectConfirmBtn');
  const count = charSelectedIndices.size;
  if (count === 0) {
    info.textContent = '未选择角色';
    btn.disabled = true;
  } else {
    const names = [...charSelectedIndices].map(i => (appData.characters[i] || {}).name).filter(Boolean);
    info.textContent = `已选 ${count} 人：${names.join('、')}`;
    btn.disabled = false;
  }

async function syncFromCloud() {
  const token = appData.settings.syncToken;
  if (!token) {
    showToast('请先在设置中填写同步 Token', 'error');
    return;
  }
  try {
    showToast('正在从云端拉取数据...', 'success');
    const response = await fetch(getChatSyncUrl() + '?t=' + Date.now(), {
      method: 'GET',
      cache: 'no-store',
      headers: {
        'Authorization': 'Bearer ' + token
      }
    });
    if (!response.ok) {
      const errText = await response.text().catch(() => '');
      throw new Error('拉取失败: ' + response.status + (errText ? ' ' + errText : ''));
    }
    const result = await response.json();
    // 支持两种响应格式：{ data: "base64..." } 或直接 base64 字符串
    const rawText = (result && result.data) ? result.data : (typeof result === 'string' ? result : JSON.stringify(result));
    let data;
    try {
      // 先尝试 base64 解码
      const jsonStr = base64ToJson(rawText.trim());
      data = JSON.parse(jsonStr);
    } catch (e1) {
      // 再尝试直接 JSON 解析
      try {
        data = JSON.parse(rawText.trim());
      } catch (e2) {
        throw new Error('无法解析云端数据');
      }
    }

    if (!data.chats || !data.settings) {
      throw new Error('云端数据格式无效');
    }

    // 兼容性补全
    if (!data.chatOrder) data.chatOrder = Object.keys(data.chats);
    if (!data.chatCounter) data.chatCounter = data.chatOrder.length;
    if (!data.theme) data.theme = 'light';
    if (!data.characters) data.characters = [];
    if (data._shareLite) {
      data = expandShareData(data);
    }

    if (!confirm('从云端拉取的数据将覆盖当前数据，确定继续吗？')) return;

    applyImportedData(data);
    showToast('云端数据同步成功', 'success');
  } catch (e) {
    console.error('云端同步失败', e);
    showToast('云端同步失败: ' + e.message, 'error');
  }
}

function applyImportedData(data) {
  appData = data;
  saveData();
  // 刷新界面
  applyTheme(appData.theme);
  document.getElementById('apiHost').value = appData.settings.apiHost || '';
  document.getElementById('apiKey').value = appData.settings.apiKey || '';
  document.getElementById('compressThreshold').value = appData.settings.compressThreshold || COMPRESS_THRESHOLD;
  document.getElementById('speakerMode').checked = appData.settings.speakerMode !== false;
  document.getElementById('autoTopic').checked = !!appData.settings.autoTopic;
  document.getElementById('chatNotification').checked = !!appData.settings.chatNotification;
  document.getElementById('autoTopicInterval').value = appData.settings.autoTopicInterval || 10;
  document.getElementById('autoTopicMaxCount').value = appData.settings.autoTopicMaxCount || 5;
  toggleAutoTopicConfig();
  document.getElementById('syncToken').value = appData.settings.syncToken || '';
  document.getElementById('cloudSyncHost').value = appData.settings.cloudSyncHost || '';
  applyBgImage(appData.settings.bgImage);
  updateBgImageStatus();
  renderChatList();
  if (appData.chatOrder.length > 0) {
    selectChat(appData.chatOrder[0]);
  } else {
    currentChatId = null;
    updateUIForNoChat();
  }
  initAutoTopic();
  initChatNotification();
}

// ==================== 自动找话题 ====================
let autoTopicTimer = null;
let lastActivityTime = Date.now();
let autoTopicCount = 0; // 当前连续触发次数

function initAutoTopic() {
  if (autoTopicTimer) {
    clearInterval(autoTopicTimer);
    autoTopicTimer = null;
  }
  autoTopicCount = 0;
  if (appData.settings.autoTopic) {
    // 每分钟检查一次是否需要触发
    autoTopicTimer = setInterval(checkAutoTopic, 60000);
  }
}

function resetAutoTopicTimer() {
  lastActivityTime = Date.now();
}

function handleVisibilityChange() {
  // 页面变为可见时，如果有未读的自动消息，不需要特别处理
  // 因为消息已经添加到聊天记录中了
}

function checkAutoTopic() {
  if (!appData.settings.autoTopic) return;
  if (!currentChatId || !appData.chats[currentChatId]) return;
  if (isStreaming || isCompressing) return;
  // 检查触发次数上限
  const maxCount = appData.settings.autoTopicMaxCount || 5;
  if (autoTopicCount >= maxCount) return;
  // 检查用户是否在页面上
  if (!document.hidden) {
    lastActivityTime = Date.now();
    return;
  }
  // 检查是否已经超过指定分钟无操作
  const intervalMin = appData.settings.autoTopicInterval || 10;
  const idleMs = Date.now() - lastActivityTime;
  if (idleMs < intervalMin * 60 * 1000) return;
  // 触发自动话题
  triggerAutoTopic();
}

async function triggerAutoTopic() {
  const chat = appData.chats[currentChatId];
  if (!chat) return;

  const apiKey = appData.settings.apiKey;
  if (!apiKey) return;

  const apiHost = appData.settings.apiHost || DEFAULT_API_HOST;
  const url = apiHost.replace(/\/+$/, '') + '/chat/completions';

  // 构建消息列表
  const sp = getCurrentSpVersion();
  const messages = [];
  if (sp.content) {
    messages.push({ role: 'system', content: sp.content });
  }
  const startIdx = sp.lastIndex + 1;
  for (let i = startIdx; i < chat.messages.length; i++) {
    messages.push({ role: chat.messages[i].role, content: chat.messages[i].content });
  }

  // 构建自动话题提示
  const charNames = (appData.characters || []).map(c => c.name).filter(Boolean);
  const charHint = charNames.length > 0
    ? `可选角色有：${charNames.join('、')}。`
    : '';

  messages.push({
    role: 'user',
    content: `[系统提示：用户已经离开${appData.settings.autoTopicInterval || 10}分钟了，请随机选择一个角色${charHint}发起一个话题，或者让两个角色之间进行闲聊。请用【角色名】的格式来标记说话人。直接输出内容，不需要额外的说明。]`
  });

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: DEFAULT_MODEL,
        messages: messages,
        stream: false
      })
    });

    if (!response.ok) throw new Error('自动话题请求失败');

    const result = await response.json();
    const content = result.choices?.[0]?.message?.content || '';

    if (content) {
      chat.messages.push({ role: 'assistant', content: content });
      saveData();
      // 重新渲染消息
      if (currentChatId) renderMessages();
      // 发送通知
      if (appData.settings.chatNotification) {
        sendChatNotification(content);
      }
    }
  } catch (e) {
    console.error('自动话题失败', e);
  }

  // 重置活动时间，避免频繁触发
  lastActivityTime = Date.now();
  autoTopicCount++;
}

// ==================== 聊天通知（Web Push 版）====================
let notificationPermissionGranted = false;
let serviceWorkerRegistration = null;
let pushSubscription = null; // 当前的 PushSubscription 对象

// ── 工具：将 VAPID 公钥（base64url）转换为 Uint8Array ──
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// ── 初始化：获取 SW 注册 + 恢复已有 Push 订阅 ──
function initChatNotification() {
  if (!('serviceWorker' in navigator) || !('Notification' in window) || !('PushManager' in window)) {
    console.warn('[通知] 当前环境不支持 Push 通知');
    return;
  }

  navigator.serviceWorker.ready.then(async registration => {
    serviceWorkerRegistration = registration;
    console.log('[通知] SW 就绪');

    // 恢复已有订阅（刷新页面后不需要重新订阅）
    pushSubscription = await registration.pushManager.getSubscription();
    if (pushSubscription) {
      console.log('[通知] 已有 Push 订阅，无需重新订阅');
      notificationPermissionGranted = true;
    }
  }).catch(err => {
    console.warn('[通知] SW ready 失败', err);
  });

  // 检查已有权限状态
  if (Notification.permission === 'granted') {
    notificationPermissionGranted = true;
  }

  // 监听 SW 推送的心跳消息（页面可见时由页面负责触发 autoTopic）
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data && event.data.type === 'PUSH_HEARTBEAT') {
      console.log('[通知] 收到心跳，尝试触发 autoTopic');
      // 复用已有的自动话题逻辑：只在页面可见且空闲时触发
      if (appData && appData.settings && appData.settings.autoTopic) {
        const maxCount = appData.settings.autoTopicMaxCount || 5;
        if (autoTopicCount < maxCount) {
          triggerAutoTopic();
        }
      }
    }
  });
}

// ── 平台检测 ──
function checkNotificationPlatformSupport() {
  if (!('Notification' in window) || !('PushManager' in window)) {
    showToast('当前浏览器不支持推送通知', 'error');
    return false;
  }
  // iOS 需要添加到主屏幕
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches;
  if (isIOS && !isStandalone) {
    showToast('iOS 需先将应用添加到主屏幕，再开启通知', 'error');
    return false;
  }
  return true;
}

// ── 当用户勾选"聊天通知"时调用 ──
async function requestNotificationPermission() {
  if (!checkNotificationPlatformSupport()) return false;

  if (Notification.permission === 'denied') {
    showToast('通知权限已被拒绝，请在浏览器/系统设置中手动允许', 'error');
    return false;
  }

  // 请求通知权限（必须在用户手势中调用）
  let permission = Notification.permission;
  if (permission !== 'granted') {
    try {
      permission = await Notification.requestPermission();
    } catch (e) {
      console.error('[通知] requestPermission 失败', e);
      return false;
    }
  }
  if (permission !== 'granted') {
    showToast('通知权限被拒绝', 'error');
    return false;
  }
  notificationPermissionGranted = true;

  // 订阅 Push
  await subscribePush();
  return notificationPermissionGranted;
}

// ── 向服务器注册 Push 订阅 ──
async function subscribePush() {
  if (!serviceWorkerRegistration) {
    console.warn('[通知] SW 未就绪，无法订阅 Push');
    return;
  }

  const token = appData.settings.syncToken;
  if (!token) {
    showToast('请先在设置中填写同步 Token，用于绑定推送', 'error');
    return;
  }

  try {
    // 1. 拿到服务器的 VAPID 公钥
    const keyResp = await fetch(`${getCloudHost()}/api/push/vapid-public-key`);
    if (!keyResp.ok) throw new Error('获取 VAPID 公钥失败: ' + keyResp.status);
    const { publicKey } = await keyResp.json();

    // 2. 订阅（若已订阅则先取消旧的）
    const existing = await serviceWorkerRegistration.pushManager.getSubscription();
    if (existing) await existing.unsubscribe();

    pushSubscription = await serviceWorkerRegistration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    console.log('[通知] Push 订阅成功', pushSubscription.endpoint);

    // 3. 上报订阅到服务器
    const regResp = await fetch(`${getCloudHost()}/api/push/subscribe`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({
        token,
        subscription: pushSubscription.toJSON()
      })
    });
    if (!regResp.ok) throw new Error('上报订阅失败: ' + regResp.status);

    showToast('推送通知已启用 ✅', 'success');
  } catch (e) {
    console.error('[通知] subscribePush 失败', e);
    showToast('Push 订阅失败: ' + e.message, 'error');
    notificationPermissionGranted = false;
  }
}

// ── 取消 Push 订阅（用户取消勾选时调用）──
async function unsubscribePush() {
  if (!pushSubscription) return;
  const endpoint = pushSubscription.endpoint;
  try {
    await pushSubscription.unsubscribe();
    pushSubscription = null;
    notificationPermissionGranted = false;

    const token = appData.settings.syncToken;
    if (token) {
      fetch(`${getCloudHost()}/api/push/unsubscribe`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ endpoint })
      }).catch(() => {});
    }
    console.log('[通知] Push 订阅已取消');
  } catch (e) {
    console.error('[通知] unsubscribePush 失败', e);
  }
}

// ── 页面可见时展示 AI 生成的通知（autoTopic 触发后调用）──
async function sendChatNotification(content) {
  if (!appData.settings.chatNotification) return;
  if (!notificationPermissionGranted) return;
  if (!serviceWorkerRegistration) return;

  // 从内容中提取说话人
  let speakerName = '';
  let speakerAvatar = null;
  const speakerMatch = content.match(/【(.+?)】/);
  if (speakerMatch) {
    speakerName = speakerMatch[1];
    const charInfo = findCharacter(speakerName);
    // 【方案B修复】icon 不支持 data URL，只使用真实路径
    if (charInfo && charInfo.avatar && !charInfo.avatar.startsWith('data:')) {
      speakerAvatar = charInfo.avatar;
    }
  }

  let displayContent = content.length > 50 ? content.slice(0, 50) + '...' : content;
  displayContent = displayContent.replace(/【.+?】/g, '').trim();

  const title = speakerName ? `${speakerName} 发来了消息` : 'AI Chat 新消息';
  const options = {
    body: displayContent,
    icon: speakerAvatar || 'icons/icon-192.png', // 已过滤 data URL
    badge: 'icons/icon-96.png',
    tag: 'aichat-notification',
    renotify: true,
    requireInteraction: false,
    silent: false
  };

  console.log('[通知] 发送前台通知', title);

  try {
    // 通过 SW 发送（支持 PWA 后台）
    await serviceWorkerRegistration.showNotification(title, options);
    // SW 通知不会自动关闭，手动清理
    setTimeout(() => {
      serviceWorkerRegistration.getNotifications({ tag: 'aichat-notification' })
        .then(ns => ns.forEach(n => n.close()));
    }, 5000);
  } catch (e) {
    console.error('[通知] 通知发送失败', e);
  }
}
